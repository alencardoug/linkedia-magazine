# Validate, test, build and run the browser smoke suite on every PR and push; deploy to Firebase Hosting
# (site `linkedia`) only on push to `main`, after both jobs pass. Keyless: GitHub OIDC -> Workload Identity
# Federation (provider accepts only this repo, ref main, push events) -> service account with
# roles/firebasehosting.admin. No secrets in the repo.
# Actions are pinned to commit SHAs (tag in the comment); bump them deliberately.
# Fast path (V2-01): `changes` classifies the run (scripts/ci/classify-changes.mjs). A push or PR that changes only
# exported content (`content/articles|editions|tags`, added or modified) runs `build` + `smoke` (changed pages, the
# articles a changed edition or catalog entry alters, and the entry, on the built dist); anything else, or anything unclear, runs `build` + the full `e2e`. `build` always runs
# and fails if the classification failed, so the required check `build` keeps reporting. Deploy needs the suite
# its mode selected and refuses any commit that is no longer the head of main (a re-run of an old run).
# Cover suite (V2-06c): on the full path `e2e` skips e2e/cover.spec.mjs only when `changes` reports covers=false
# (every changed path is a known reading-only one); a missing or other value runs it.
name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
      covers: ${{ steps.classify.outputs.covers }}
      files: ${{ steps.classify.outputs.files }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: classify
        run: node scripts/ci/classify-changes.mjs

  build:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Classification succeeded
        env:
          RESULT: ${{ needs.changes.result }}
          MODE: ${{ needs.changes.outputs.mode }}
        run: |
          echo "changes: $RESULT, mode: $MODE"
          [ "$RESULT" = success ] && { [ "$MODE" = content ] || [ "$MODE" = full ]; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          retention-days: 7
          if-no-files-found: error

  e2e:
    # Full path. Browser suites served by the Hosting emulator with firebase.json: one build of the example content
    # (smoke 1B-04, reading modes V2-06, covers, specials, redirects), then the v2 fixture content smoke (V2-05).
    needs: changes
    if: needs.changes.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          LINKEDIA_SKIP_COVERS: ${{ needs.changes.outputs.covers == 'false' && '1' || '' }}
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mode-screenshots
          path: test-results/screenshots
          if-no-files-found: ignore
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  smoke:
    # Content-only path: the changed pages and the entry on the dist that `build` produced (the one that deploys).
    needs: [changes, build]
    if: needs.changes.outputs.mode == 'content' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:content
        env:
          LINKEDIA_SMOKE_FILES: ${{ needs.changes.outputs.files }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-smoke
          path: |
            playwright-report
            test-results
          retention-days: 7

  deploy:
    needs: [changes, build, e2e, smoke]
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.build.result == 'success' &&
      ((needs.changes.outputs.mode == 'full' && needs.e2e.result == 'success') ||
       (needs.changes.outputs.mode == 'content' && needs.smoke.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://linkedia.web.app
    permissions:
      contents: read
      id-token: write # OIDC token for Workload Identity Federation; only this job gets it
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            firebase.json
            .firebaserc
          sparse-checkout-cone-mode: false
      - name: Still the head of main
        run: |
          head=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::error::main is at ${head:-?}, this run built $GITHUB_SHA: refusing to deploy an older commit (re-run the newest run instead)."
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/991312603178/locations/global/workloadIdentityPools/github/providers/linkedia-magazine
          service_account: github-deploy@linked-ia.iam.gserviceaccount.com
      - name: Still the head of main (right before deploying)
        run: |
          head=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::error::main is at ${head:-?}, this run built $GITHUB_SHA: refusing to deploy an older commit (re-run the newest run instead)."
            exit 1
          fi
      - run: npx --yes firebase-tools@15.34.0 deploy --only hosting --project linked-ia --non-interactive
      - name: Smoke test
        run: |
          curl -fsS --retry 5 --retry-delay 5 https://linkedia.web.app/ -o home.html
          grep -q '<html lang="pt-BR"' home.html
